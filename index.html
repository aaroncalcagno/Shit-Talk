<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shit Talk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffe8d3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#24150c" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{box-sizing:border-box;height:100%}body{margin:0;font-size:14px;height:100%}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Shit Talk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: iPhone-style single column. Large-title header, full-bleed photo cards, floating glass tab bar, bottom sheets. */
:root{
  --bg:#fff6ec; --bg-2:#ffe8d3; --surface:#ffffff; --surface-2:#fbefe2; --line:#f0dcc8;
  --fg:#2a170b; --muted:#8a6a55;
  --cocoa:#5b3216; --caramel:#c77a32; --gold:#f2b130; --like:#ff4f7e; --pass:#7c8aa0; --super:#2fb6ff; --good:#20b77a;
  --glass:rgba(255,255,255,.72);
  --display:"Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:-apple-system,"SF Pro Text","Figtree",ui-sans-serif,system-ui,sans-serif;
  --spring:cubic-bezier(.2,1.35,.4,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#170e09; --bg-2:#24150c; --surface:#2a1b12; --surface-2:#352318; --line:#3e2a1d;
  --fg:#fbeee2; --muted:#c3a28b; --cocoa:#f0c08f; --caramel:#e39a52; --glass:rgba(42,27,18,.72); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#170e09; --bg-2:#24150c; --surface:#2a1b12; --surface-2:#352318; --line:#3e2a1d;
  --fg:#fbeee2; --muted:#c3a28b; --cocoa:#f0c08f; --caramel:#e39a52; --glass:rgba(42,27,18,.72); color-scheme:dark}
html,body{height:100%}
body{background:radial-gradient(120% 60% at 50% 0%,var(--bg-2),var(--bg) 70%) var(--bg);color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;color:inherit}
.app{max-width:430px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 0}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:6px 2px 10px}
.logo{font-family:var(--display);font-weight:400;font-size:2.15rem;line-height:1;margin:0;color:var(--cocoa);display:flex;align-items:center;gap:6px;animation:pop .7s var(--spring) both}
.logo i{font-style:normal;display:inline-block;animation:wobble 3.2s ease-in-out infinite;transform-origin:50% 90%}
.logo b{font-weight:400;background:linear-gradient(90deg,var(--caramel),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:.8rem;color:var(--muted);font-weight:600;margin:4px 0 0}
.pill{border:0;background:var(--surface);box-shadow:0 2px 10px rgba(91,50,22,.12);border-radius:99px;padding:8px 12px;font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap}
.pill em{font-style:normal;color:var(--caramel)}
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;padding-bottom:100px;animation:viewIn .45s var(--spring) both}
@keyframes viewIn{from{opacity:0;transform:translateY(14px) scale(.985)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@keyframes wobble{0%,100%{transform:rotate(0)}10%{transform:rotate(-12deg)}20%{transform:rotate(10deg)}30%{transform:rotate(0)}}

/* deck */
.deck{position:relative;flex:1;min-height:340px}
.card{position:absolute;inset:0;border-radius:28px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;
  box-shadow:0 18px 40px -12px rgba(91,50,22,.35),0 2px 6px rgba(91,50,22,.12);background:var(--surface);will-change:transform}
.card.enter{animation:cardIn .6s var(--spring) both}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.9)}}
.card canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:auto 0 0 0;height:62%;background:linear-gradient(to top,rgba(26,12,4,.92) 8%,rgba(26,12,4,.55) 50%,transparent)}
.info{position:absolute;left:0;right:0;bottom:0;padding:18px 18px 20px;color:#fff;display:flex;flex-direction:column;gap:8px}
.nm{font-family:var(--display);font-size:2rem;line-height:1;display:flex;align-items:baseline;gap:8px}
.nm small{font-family:var(--body);font-weight:600;font-size:1.25rem;opacity:.85}
.bio{margin:0;font-size:.9rem;line-height:1.38;opacity:.93;text-wrap:pretty}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.7rem;font-weight:800;letter-spacing:.04em;padding:5px 9px;border-radius:99px;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;white-space:nowrap}
.tag.gold{background:linear-gradient(90deg,#f2b130,#ffd76a);color:#3a2208}
.compat{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.9);color:#3a2208;border-radius:99px;padding:6px 10px;font-weight:800;font-size:.78rem;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.stamp{position:absolute;top:36px;font-family:var(--display);font-size:1.9rem;padding:2px 14px;border:4px solid;border-radius:14px;opacity:0;pointer-events:none;background:rgba(255,255,255,.12);backdrop-filter:blur(2px)}
.stamp.yes{left:18px;color:#5ef2ae;transform:rotate(-14deg)}
.stamp.no{right:18px;color:#ff7b9c;transform:rotate(14deg)}
.stamp.sup{left:50%;top:auto;bottom:45%;transform:translateX(-50%) rotate(-6deg);color:#7fd6ff}
.actions{display:flex;justify-content:center;align-items:center;gap:18px}
.ab{border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:var(--surface);
  box-shadow:0 8px 22px -6px rgba(91,50,22,.35);transition:transform .35s var(--spring)}
.ab:active{transform:scale(.86)}
.ab svg{width:46%;height:46%}
.ab.pass{width:60px;height:60px;color:var(--pass)}
.ab.sup{width:48px;height:48px;color:var(--super)}
.ab.like{width:68px;height:68px;color:#fff;background:linear-gradient(135deg,#ff7a59,var(--like));animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 8px 22px -6px rgba(255,79,126,.55)}50%{box-shadow:0 8px 30px 2px rgba(255,79,126,.45)}}
.ab:focus-visible,.tb:focus-visible,.pill:focus-visible,.primary:focus-visible,.seg button:focus-visible,.row-btn:focus-visible{outline:3px solid var(--caramel);outline-offset:3px}

/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(398px,calc(100% - 32px));
  display:flex;gap:4px;padding:6px;border-radius:26px;background:var(--glass);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);
  box-shadow:0 10px 30px -8px rgba(91,50,22,.35);border:1px solid var(--line);z-index:5}
.tb{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-radius:20px;font-size:.68rem;font-weight:700;color:var(--muted);cursor:pointer;position:relative;transition:color .2s}
.tb svg{width:24px;height:24px;transition:transform .45s var(--spring)}
.tb[aria-selected="true"]{color:var(--cocoa);background:var(--surface)}
.tb[aria-selected="true"] svg{transform:scale(1.15) translateY(-1px)}
.badge{position:absolute;top:4px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--like);color:#fff;font-size:.65rem;display:grid;place-items:center;animation:pop .5s var(--spring)}

/* generic panels */
.h2{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0;color:var(--cocoa);text-wrap:balance}
.card2{background:var(--surface);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 24px -14px rgba(91,50,22,.4)}
.scroll{overflow:auto;display:flex;flex-direction:column;gap:14px;flex:1;min-height:0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.lbl{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.drop{position:relative;border-radius:22px;aspect-ratio:1/1;max-width:100%;overflow:hidden;cursor:pointer;display:grid;place-items:center;text-align:center;
  background:repeating-linear-gradient(135deg,var(--surface-2) 0 14px,var(--surface) 14px 28px);border:2px dashed var(--caramel);color:var(--muted);font-weight:600;transition:transform .4s var(--spring)}
.drop:active{transform:scale(.98)}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:pop .5s var(--spring)}
.drop .cam{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;background:linear-gradient(135deg,var(--gold),var(--caramel));color:#fff;box-shadow:0 8px 20px -6px rgba(199,122,50,.7)}
.linkbtn{border:0;background:none;color:var(--caramel);font-weight:700;font-size:.85rem;cursor:pointer;padding:4px;align-self:center}
.seg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.seg button{border:0;background:var(--surface-2);border-radius:12px;padding:9px 0;font-weight:800;font-size:.95rem;cursor:pointer;transition:transform .35s var(--spring),background .2s}
.seg button.on{background:var(--cocoa);color:var(--bg);transform:scale(1.08)}
.legend{margin:0;font-size:.85rem;color:var(--muted);line-height:1.35;min-height:2.6em}
.legend b{color:var(--fg)}
.primary{border:0;border-radius:18px;padding:15px;font-weight:800;font-size:1.02rem;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--gold),var(--caramel) 60%,#a65a1d);box-shadow:0 10px 24px -10px rgba(166,90,29,.8);transition:transform .35s var(--spring)}
.primary:active{transform:scale(.96)}
.primary:disabled{opacity:.45;box-shadow:none}

/* matches */
.newrow{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.av{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;cursor:pointer;font-size:.78rem;font-weight:700;animation:pop .5s var(--spring) both}
.av canvas{width:68px;height:68px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--like)}
.row-btn{display:flex;gap:12px;align-items:center;border:0;background:var(--surface);border-radius:20px;padding:10px 12px;cursor:pointer;text-align:left;width:100%;animation:viewIn .45s var(--spring) both;box-shadow:0 6px 18px -12px rgba(91,50,22,.45)}
.row-btn canvas{width:54px;height:54px;border-radius:50%;flex:none;object-fit:cover}
.row-btn div{min-width:0;flex:1}
.row-btn b{display:block;font-size:.98rem}
.row-btn span{display:block;font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px}
.empty .big{font-size:3.4rem;display:block;animation:wobble 3s ease-in-out infinite}
.empty h3{font-family:var(--display);font-weight:400;color:var(--cocoa);font-size:1.5rem;margin:8px 0 6px}
.empty p{margin:0 0 16px;line-height:1.4}

/* chat */
.chathead{display:flex;align-items:center;gap:10px}
.chathead canvas{width:42px;height:42px;border-radius:50%}
.back{border:0;background:var(--surface);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;flex:none}
.msgs{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:6px 2px}
.bub{max-width:78%;padding:10px 14px;border-radius:20px;font-size:.95rem;line-height:1.32;animation:bub .4s var(--spring) both}
@keyframes bub{from{opacity:0;transform:scale(.6) translateY(8px)}}
.bub.them{background:var(--surface);align-self:flex-start;border-bottom-left-radius:6px;transform-origin:left bottom}
.bub.me{background:linear-gradient(135deg,var(--caramel),#a65a1d);color:#fff;align-self:flex-end;border-bottom-right-radius:6px;transform-origin:right bottom}
.typing{display:flex;gap:4px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.compose{display:flex;gap:8px;align-items:center;background:var(--surface);border-radius:24px;padding:6px 6px 6px 16px}
.compose input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:1rem;color:var(--fg);outline:none}
.send{border:0;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--caramel));color:#fff;display:grid;place-items:center;cursor:pointer}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.quick button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:.8rem;font-weight:600;cursor:pointer}

/* overlays */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(23,10,3,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:fade .3s both;display:flex;align-items:center;justify-content:center;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
@keyframes fade{from{opacity:0}}
.matchbox{text-align:center;color:#fff;display:flex;flex-direction:column;align-items:center;gap:16px;max-width:360px}
.matchbox h3{font-family:var(--display);font-weight:400;font-size:3rem;line-height:.95;margin:0;transform:rotate(-5deg);
  background:linear-gradient(90deg,#ffd76a,#ff9a5c,#ff4f7e);-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .8s .25s var(--spring) both;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3))}
.matchbox p{margin:0;opacity:.9;line-height:1.4}
.pair{display:flex;align-items:center}
.pair canvas,.pair img{width:118px;height:118px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.35);background:#fff}
.pair .l{animation:inL .7s var(--spring) both;transform:rotate(-8deg);margin-right:-14px}
.pair .r{animation:inR .7s var(--spring) both;transform:rotate(8deg)}
@keyframes inL{from{transform:translateX(-160px) rotate(-40deg);opacity:0}}
@keyframes inR{from{transform:translateX(160px) rotate(40deg);opacity:0}}
.ghost{border:2px solid rgba(255,255,255,.7);background:transparent;color:#fff;border-radius:18px;padding:13px;font-weight:800;cursor:pointer;width:100%}
.matchbox .primary{width:100%}

.sheet-scrim{align-items:flex-end;padding:0}
.sheet{width:min(430px,100%);max-height:calc(100% - 30px - env(safe-area-inset-top,0px));overflow:auto;background:var(--bg);border-radius:30px 30px 0 0;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  animation:sheetUp .55s var(--spring) both;display:flex;flex-direction:column;gap:14px}
@keyframes sheetUp{from{transform:translateY(100%)}}
.grabber{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.scan{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:1/1;max-width:100%;background:#000}
.scan img{width:100%;height:100%;object-fit:cover;display:block}
.scan .laser{position:absolute;left:0;right:0;height:70px;top:-70px;background:linear-gradient(to bottom,transparent,rgba(242,177,48,.55) 85%,#ffd76a);
  box-shadow:0 2px 18px #ffd76a;animation:laser 1.1s ease-in-out infinite alternate}
@keyframes laser{to{top:calc(100% - 4px)}}
.scan .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,215,106,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(255,215,106,.18) 1px,transparent 1px);background-size:28px 28px}
.scan .chipline{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.6);color:#ffd76a;font-weight:700;font-size:.82rem;padding:7px 11px;border-radius:99px;backdrop-filter:blur(6px)}
.verdict{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:2.4rem;color:var(--cocoa);font-variant-numeric:tabular-nums}
.ring .num small{display:block;font-family:var(--body);font-size:.66rem;font-weight:800;letter-spacing:.08em;color:var(--muted);margin-top:-4px;text-align:center}
.vt{min-width:0}
.vt .tier{font-family:var(--display);font-size:1.6rem;line-height:1.05;color:var(--cocoa);margin:0 0 6px;text-wrap:balance}
.vt p{margin:0;color:var(--muted);line-height:1.38;font-size:.92rem}
.bars{display:flex;flex-direction:column;gap:10px}
.bar .top{display:flex;justify-content:space-between;font-size:.85rem;font-weight:700;margin-bottom:5px}
.bar .top span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}
.bar .track{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar .fill{height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--caramel),var(--gold));transition:width 1.1s var(--spring)}
.award{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:linear-gradient(135deg,#ffe7a6,#ffc85a);color:#3a2208;animation:pop .7s var(--spring) both}
.award .medal{font-size:2rem;animation:wobble 2.4s ease-in-out infinite}
.award b{display:block}
.award span{font-size:.85rem}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;background:var(--fg);color:var(--bg);font-weight:700;font-size:.9rem;
  padding:11px 18px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toast 2.6s var(--spring) both;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30px)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-20px)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
/* iPhone polish */
*{-webkit-tap-highlight-color:transparent}
button,label,.card{touch-action:manipulation}
.card{touch-action:none}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
input{-webkit-user-select:text;user-select:text}
canvas,img{-webkit-touch-callout:none}
.compose input{font-size:16px}
.tabbar{transition:transform .45s var(--spring)}
body.chatting .tabbar{transform:translate(-50%,160%)}
body.chatting .view{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.scroll{padding-bottom:4px}
@media (max-height:780px){
  header{padding:2px 2px 8px}
  .logo{font-size:1.85rem}
  .sub{display:none}
  .view{gap:10px;padding-bottom:90px}
  .deck{min-height:0}
  .nm{font-size:1.7rem}.nm small{font-size:1.05rem}
  .info{padding:14px 16px 16px;gap:7px}
  .bio{font-size:.86rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .info .tags:last-child{display:none}
  .ab.pass{width:54px;height:54px}.ab.sup{width:44px;height:44px}.ab.like{width:62px;height:62px}
  .drop{aspect-ratio:4/3}
}
@media (max-height:640px){
  .info .nm + .tags .tag:not(.gold){display:none}
  .bio{-webkit-line-clamp:2}
  .tb{padding:6px 0 4px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

</head>
<body>
<div class="app">
  <header>
    <div>
      <h1 class="logo"><i>💩</i>Shit<b>Talk</b></h1>
      <p class="sub" id="sub">Find someone who gives a shit</p>
    </div>
    <button class="pill" id="pill">Into: <em>Type 4</em></button>
  </header>
  <main class="view" id="view"></main>
</div>

/* ---------- confetti ---------- */
const cf=$("#confetti"),cx=cf.getContext("2d");let parts=[],raf=0;
function confetti(n=140,emoji=["💩","✨","🏆"]){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  cf.width=innerWidth*devicePixelRatio;cf.height=innerHeight*devicePixelRatio;
  const cols=["#f2b130","#ff4f7e","#2fb6ff","#20b77a","#ffd76a","#c77a32"];
  for(let i=0;i<n;i++){const isE=Math.random()<.22;parts.push({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.42,vx:(Math.random()-.5)*14,vy:-Math.random()*16-6,
    r:Math.random()*6.3,vr:(Math.random()-.5)*.4,s:isE?22+Math.random()*12:6+Math.random()*6,c:cols[i%cols.length],e:isE?emoji[i%emoji.length]:null,life:0})}
  if(!raf)tick();
}
function tick(){
  cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{p.vy+=.42;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.max(0,1-p.life/160);
    if(p.e){cx.font=`${p.s}px serif`;cx.textAlign="center";cx.fillText(p.e,0,0)}else{cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2)}cx.restore()});
  parts=parts.filter(p=>p.y<innerHeight+60&&p.life<160);
  raf=parts.length?requestAnimationFrame(tick):(cx.clearRect(0,0,innerWidth,innerHeight),0);
}

function attachDrag(card,p,under){

    card.querySelector(".yes").style.opacity=Math.max(0,dx/110);card.querySelector(".no").style.opacity=Math.max(0,-dx/110);
    card.querySelector(".sup").style.opacity=Math.abs(dx)<60?Math.max(0,-dy/120):0;
    if(under){const k=Math.min(1,Math.hypot(dx,dy)/160);under.style.transform=`scale(${.94+.06*k}) translateY(${14-14*k}px)`}};
  card.addEventListener("pointerdown",e=>{down=true;sx=e.clientX;sy=e.clientY;t0=performance.now();card.setPointerCapture(e.pointerId);card.style.transition="none";card.classList.remove("enter");if(under)under.style.transition="none"});
  card.addEventListener("pointermove",e=>{if(!down)return;dx=e.clientX-sx;dy=e.clientY-sy;set()});
  const up=()=>{if(!down)return;down=false;const v=Math.abs(dx)/Math.max(1,performance.now()-t0);
    if(Math.abs(dx)>110||v>.7&&Math.abs(dx)>40)fling(card,Math.sign(dx),p,under);
    else if(-dy>140&&Math.abs(dx)<60)fling(card,0,p,under);
    else{card.style.transition="transform .55s var(--spring)";dx=dy=0;set();card.querySelectorAll(".stamp").forEach(s=>s.style.opacity=0);if(under){under.style.transition="transform .55s var(--spring)"}}};
  card.addEventListener("pointerup",up);card.addEventListener("pointercancel",up);
}

    <p>${sup?`You sent ${esc(p.n)} a Golden Flush. They're into it.`:`You and ${esc(p.n)} are both into Type ${myType}. Nature is healing.`}</p>
    <button class="primary" id="go">Start talking shit</button><button class="ghost" id="keep">Keep swiping</button></div></div>`);
  o.querySelector(".pair").append(mine,theirs);document.body.appendChild(o);
  setTimeout(()=>confetti(sup?180:120,sup?["✨","🏆","💛"]:["💩","💖","✨"]),250);
  o.querySelector("#keep").onclick=()=>o.remove();
  o.querySelector("#go").onclick=()=>{o.remove();openChat=matches[0];setTab("matches")};
}

/* ---------- Rate Mine ---------- */
function renderDrop(){
  V=freshView();$("#sub").textContent="Show us what you made today";
  const s=el(`<div class="scroll">
    <div class="card2">
      <label class="drop" for="file" id="drop">${myPic?`<img src="${myPic}" alt="Your upload">`:`<div><div class="cam"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></div>Snap or upload today's masterpiece<br><small>Good lighting. Lid up. Be proud.</small></div>`}</label>
      <input type="file" id="file" accept="image/*" hidden>
      <button class="linkbtn" id="sample">${myPic?"Choose a different photo":"No photo handy? Use a sample"}</button>
    </div>
    <div class="card2"><span class="lbl">What type is it?</span><div class="seg" id="ptype"></div><p class="legend" id="plegend"></p></div>
    <div class="card2"><span class="lbl">What type are you into?</span><div class="seg" id="mtype"></div><p class="legend" id="mlegend"></p></div>
    <button class="primary" id="rate" ${myPic?"":"disabled"}>Rate my shit ✨</button>
  </div>`);
  V.appendChild(s);
  const seg=(id,lg,get,setv)=>{const box=s.querySelector(id);box.innerHTML="";for(let i=1;i<=7;i++){const b=el(`<button class="${get()===i?"on":""}" aria-label="Type ${i}">${i}</button>`);
    b.onclick=()=>{setv(i);seg(id,lg,get,setv)};box.appendChild(b)}s.querySelector(lg).innerHTML=`<b>Type ${get()}: ${BRISTOL[get()][0]}.</b> ${BRISTOL[get()][1]}.`};
  seg("#ptype","#plegend",()=>myPicType,v=>myPicType=v);
  seg("#mtype","#mlegend",()=>myType,v=>{myType=v;save();updPill()});
  const setPic=src=>{myPic=src;rated=null;s.querySelector("#drop").innerHTML=`<img src="${src}" alt="Your upload">`;s.querySelector("#rate").disabled=false;s.querySelector("#sample").textContent="Choose a different photo"};
  s.querySelector("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>setPic(fr.result);fr.readAsDataURL(f)};
  s.querySelector("#sample").onclick=()=>{if(myPic){s.querySelector("#file").click();return}myPicType=4;seg("#ptype","#plegend",()=>myPicType,v=>myPicType=v);setPic(drawSpecimen(4,4,38,600,600).toDataURL("image/jpeg",.9))};
  s.querySelector("#rate").onclick=()=>rateIt();
}
function analyze(src){
  return new Promise(res=>{const im=new Image();im.onload=()=>{const N=64,cv=document.createElement("canvas");cv.width=cv.height=N;const c=cv.getContext("2d");
    c.drawImage(im,0,0,N,N);const d=c.getImageData(0,0,N,N).data;let brown=0,tot=0,h=0;
    for(let y=10;y<54;y++)for(let x=10;x<54;x++){const i=(y*N+x)*4,R=d[i]/255,G=d[i+1]/255,B=d[i+2]/255,mx=Math.max(R,G,B),mn=Math.min(R,G,B),l=(mx+mn)/2,ch=mx-mn;
      let hue=0;if(ch){hue=mx===R?((G-B)/ch)%6:mx===G?(B-R)/ch+2:(R-G)/ch+4;hue*=60;if(hue<0)hue+=360}
      const sat=ch?ch/(1-Math.abs(2*l-1)):0;tot++;h=(h*31+d[i]+d[i+1]*7)%100000;
      if(hue>=12&&hue<=48&&sat>.2&&l>.1&&l<.6)brown++}
    res({ratio:brown/tot,hash:h})};im.onerror=()=>res({ratio:.2,hash:7});im.src=src});
}
const FORM={1:34,2:56,3:86,4:98,5:72,6:41,7:14};
function tierFor(score){
  if(score>=90)return["Absolute Masterpiece","🏆","Museum quality. Call your mother, she'd be so proud. This one deserves a moment of silence before the flush."];
  if(score>=78)return["Beautiful Work","🥇",`A textbook Type ${myPicType}. Smooth delivery, great posture. Honestly, frame it.`];
  if(score>=62)return["Solid Effort","👏","Respectable. A little more fiber and a little less stress and you're in the big leagues."];
  if(score>=42)return["Rough Day","🫡","You showed up, and that counts. Drink some water, champ."];
  return["Seek Help","🚑","We say this with love: maybe text a doctor before you text a match."];
}
async function rateIt(){
  const a=await analyze(myPic);
  const form=FORM[myPicType],color=Math.round(Math.max(24,Math.min(99,30+a.ratio*230))),curb=72+a.hash%27;
  const score=Math.round(form*.5+color*.3+curb*.2);rated={score,form,color,curb};
  const steps=["Measuring coil tension…","Analyzing color richness…","Consulting the Bristol board…","Calculating curb appeal…"];
  const o=el(`<div class="scrim sheet-scrim"><div class="sheet" role="dialog" aria-label="Your rating"><div class="grabber"></div>
    <div class="scan"><img src="${myPic}" alt=""><div class="grid"></div><div class="laser"></div><div class="chipline" id="step">${steps[0]}</div></div></div></div>`);
  document.body.appendChild(o);
  o.addEventListener("click",e=>{if(e.target===o)o.remove()});
  let i=0;const iv=setInterval(()=>{i++;if(i<steps.length)o.querySelector("#step").textContent=steps[i]},550);
  setTimeout(()=>{clearInterval(iv);showResult(o,rated)},2300);
}
function showResult(o,r){
  const [tier,medal,msg]=tierFor(r.score);const sh=o.querySelector(".sheet");
  const C=2*Math.PI*52;
  sh.innerHTML=`<div class="grabber"></div>
    <div class="verdict"><div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" stroke="var(--surface-2)" stroke-width="12" fill="none"/>
      <circle id="arc" cx="60" cy="60" r="52" stroke="url(#gg)" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1.4s var(--spring)"/>
      <defs><linearGradient id="gg"><stop offset="0" stop-color="#c77a32"/><stop offset="1" stop-color="#f2b130"/></linearGradient></defs></svg>
      <div class="num"><div><span id="n">0</span><small>SCORE</small></div></div></div>
      <div class="vt"><p class="tier">${medal} ${tier}</p><p>${msg}</p></div></div>
    ${r.score>=90?`<div class="award"><span class="medal">🏆</span><div><b>Golden Log unlocked</b><span>Shown on your profile so matches know you're the real deal.</span></div></div>`:""}
    <div class="bars">${[["Form",r.form],["Color richness",r.color],["Curb appeal",r.curb]].map(([k,v])=>`<div class="bar"><div class="top"><span>${k}</span><span>${v}</span></div><div class="track"><div class="fill" data-v="${v}"></div></div></div>`).join("")}</div>
    <button class="primary" id="post">Post to my profile</button>
    <button class="linkbtn" id="retake">Retake photo</button>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{sh.querySelector("#arc").style.strokeDashoffset=C*(1-r.score/100);
    sh.querySelectorAll(".fill").forEach((f,i)=>setTimeout(()=>f.style.width=f.dataset.v+"%",150+i*140))}));
  const n=sh.querySelector("#n"),t0=performance.now();(function cnt(t){const k=Math.min(1,(t-t0)/1300),e=1-Math.pow(1-k,3);n.textContent=Math.round(r.score*e);if(k<1)requestAnimationFrame(cnt)})(t0);
  if(r.score>=78)setTimeout(()=>confetti(r.score>=90?200:120,r.score>=90?["🏆","✨","💩","👑"]:["✨","💩","👏"]),500);
  sh.querySelector("#post").onclick=()=>{o.remove();toast(r.score>=90?"Posted. Your Golden Log is live 🏆":`Posted. Your Type ${myPicType} is live 💩`)};
  sh.querySelector("#retake").onclick=()=>{o.remove();$("#file")&&$("#file").click()};
}

/* ---------- Matches & chat ---------- */
function renderMatches(){
  V=freshView();unseen=0;updBadge();
  if(openChat)return renderChat(openChat);
  $("#sub").textContent="Your people. Your poopers.";
  if(!matches.length){V.appendChild(el(`<div class="empty"><div><span class="big">💌</span><h3>No matches yet</h3><p>Swipe right on people who are into your type, or send a Golden Flush (the star) to match instantly.</p><button class="primary" id="gos">Start swiping</button></div></div>`));
    $("#gos").onclick=()=>setTab("swipe");return}
  const s=el(`<div class="scroll"><span class="lbl">New matches</span><div class="newrow"></div><span class="lbl">Messages</span><div class="list" style="display:flex;flex-direction:column;gap:10px"></div></div>`);
  matches.forEach((m,i)=>{
    const a=el(`<button class="av" style="animation-delay:${i*60}ms"><span>${esc(m.p.n)}${m.sup?" ⭐":""}</span></button>`);a.prepend(avatarOf(m.p));a.onclick=()=>{openChat=m;renderMatches()};s.querySelector(".newrow").appendChild(a);
    const b=el(`<button class="row-btn" style="animation-delay:${i*60}ms"><div><b></b><span></span></div></button>`);b.querySelector("b").textContent=`${m.p.n} · Type ${m.p.t}`;
    b.querySelector("span").textContent=(m.msgs.at(-1).me?"You: ":"")+m.msgs.at(-1).t;b.prepend(avatarOf(m.p));b.onclick=()=>{openChat=m;renderMatches()};s.querySelector(".list").appendChild(b)});
  V.appendChild(s);
}
function renderChat(m){
  document.body.classList.add("chatting");$("#sub").textContent="Keep it classy. Or don't.";
  const w=el(`<div style="display:flex;flex-direction:column;gap:10px;flex:1;min-height:0">
    <div class="chathead"><button class="back" aria-label="Back to matches"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button><div><b style="font-size:1.05rem">${esc(m.p.n)}</b><div style="font-size:.78rem;color:var(--muted)">Type ${m.p.t} · ${BRISTOL[m.p.t][0]}</div></div></div>
    <div class="msgs" id="msgs"></div>
    <div class="quick" id="quick"></div>
    <form class="compose" id="f"><input id="msg" placeholder="Talk some shit…" autocomplete="off" aria-label="Message"><button class="send" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg></button></form></div>`);
  w.querySelector(".chathead").insertBefore(avatarOf(m.p),w.querySelector(".chathead div"));
  V.appendChild(w);
  const box=w.querySelector("#msgs");
  const add=(x,anim=true)=>{const b=el(`<div class="bub ${x.me?"me":"them"}"></div>`);b.textContent=x.t;if(!anim)b.style.animation="none";box.appendChild(b);box.scrollTop=box.scrollHeight};
  m.msgs.forEach(x=>add(x,false));
  const send=t=>{if(!t.trim())return;const x={me:true,t:t.trim()};m.msgs.push(x);add(x);
    const ty=el(`<div class="bub them typing"><i></i><i></i><i></i></div>`);setTimeout(()=>{box.appendChild(ty);box.scrollTop=box.scrollHeight},400);
    setTimeout(()=>{ty.remove();const y={me:false,t:REPLIES[Math.floor(Math.random()*REPLIES.length)]};m.msgs.push(y);if(box.isConnected)add(y)},1700)};
  QUICK.forEach(q=>{const b=el(`<button type="button"></button>`);b.textContent=q;b.onclick=()=>send(q);w.querySelector("#quick").appendChild(b)});
  w.querySelector("#f").onsubmit=e=>{e.preventDefault();const i=w.querySelector("#msg");send(i.value);i.value=""};
  w.querySelector(".back").onclick=()=>{openChat=null;renderMatches()};
}

/* ---------- shell ---------- */
function updPill(){$("#pill").innerHTML=`Into: <em>Type ${myType}</em>`}
function updBadge(){const t=$("#t-matches");t.querySelector(".badge")?.remove();if(unseen)t.appendChild(el(`<span class="badge">${unseen}</span>`))}
function setTab(t){["swipe","drop","matches"].forEach(k=>$("#t-"+k).setAttribute("aria-selected",k===t));({swipe:renderSwipe,drop:renderDrop,matches:renderMatches})[t]()}
$("#t-swipe").onclick=()=>setTab("swipe");
$("#t-drop").onclick=()=>setTab("drop");
$("#t-matches").onclick=()=>{openChat=null;setTab("matches")};
$("#pill").onclick=()=>setTab("drop");
updPill();renderSwipe();
</script>
